[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lazy-ci-triage"
version = "0.2.2"
description = "Local, evidence-linked CI troubleshooting hypotheses"
requires-python = ">=3.10"
dependencies = []
license = {text = "MIT"}

[project.scripts]
lazy-ci-triage = "lazy_ci_triage.cli:main"

[tool.setuptools]
packages = ["lazy_ci_triage"]
